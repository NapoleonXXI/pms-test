<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMS test</title>
<style>body{font:14px sans-serif;margin:16px}table{border-collapse:collapse;margin:8px 0}td,th{border:1px solid #ccc;padding:4px 6px;text-align:left}h2{margin-top:24px}button{margin:1px}</style></head><body>
<h1>PMS test</h1>
<p>Parcours : Demande → Confirmée (acompte 30 %) → Arrivée (check-in) → Départ (facture soldée, logement à nettoyer) → Terminée. <button onclick="reset()">Réinitialiser les données</button></p>
<h2>1. Nouvelle demande de réservation</h2>
<form onsubmit="nouvelle(event)">Client <select id="fc"></select> Arrivée <input type="date" id="fa" required> Départ <input type="date" id="fd" required> Personnes <input type="number" id="fp" value="2" min="1" style="width:50px"> <button>Envoyer la demande</button></form>
<h2>2. Réservations</h2><table id="tr"></table>
<h2>3. Logements</h2><table id="tl"></table>
<h2>4. Clients</h2><table id="tc"></table>
<h2>5. Journal</h2><ol id="tj"></ol>
<script>
var S;
function init(){var L=[];for(var i=1;i<=20;i++){var t=i<=8?["Chambre double",2,90]:i<=14?["Chambre familiale",4,130]:i<=18?["Mobile home",6,160]:["Suite",2,210];L.push({n:i,type:t[0],cap:t[1],prix:t[2],etat:"Propre"})}
S={L:L,C:[["Garcia","Céline","celine.garcia@exemple.fr","06 11 22 33 01","Chambre calme"],["Martin","Paul","paul.martin@exemple.fr","06 11 22 33 02","Lit bébé"],["Dubois","Léa","lea.dubois@exemple.fr","06 11 22 33 03","Arrivée tardive"],["Bernard","Hugo","hugo.bernard@exemple.fr","06 11 22 33 04","Animal de compagnie"],["Petit","Emma","emma.petit@exemple.fr","06 11 22 33 05","Rez-de-chaussée"],["Müller","Jonas","jonas.muller@exemple.de","+49 151 000 0006","Parle allemand"],["Rossi","Giulia","giulia.rossi@exemple.it","+39 333 000 0007","Sans gluten"],["Lefèvre","Marc","marc.lefevre@exemple.fr","06 11 22 33 08","Facture entreprise"],["Nguyen","Linh","linh.nguyen@exemple.fr","06 11 22 33 09","Deux lits séparés"],["Smith","Oliver","oliver.smith@exemple.co.uk","+44 7700 000010","Parking"]].map(function(c,i){return{id:i+1,nom:c[0],prenom:c[1],mail:c[2],tel:c[3],pref:c[4]}}),R:[],J:[],k:1};save()}
function save(){localStorage.pmsTest2=JSON.stringify(S)}
function reset(){if(confirm("Effacer toutes les données de test ?")){init();draw()}}
function log(m){S.J.unshift(new Date().toLocaleString("fr-FR")+" : "+m)}
function nuits(r){return Math.round((new Date(r.d)-new Date(r.a))/864e5)}
function lg(n){return S.L.find(function(l){return l.n==n})}
function cl(id){return S.C.find(function(c){return c.id==id})}
function libre(n,a,d,x){return !S.R.some(function(r){return r.id!=x&&r.log==n&&["Annulée","Terminée"].indexOf(r.st)<0&&r.a<d&&a<r.d})}
function nouvelle(e){e.preventDefault();var a=fa.value,d=fd.value;if(d<=a)return alert("Le départ doit être après l'arrivée.");
S.R.push({id:S.k++,c:+fc.value,a:a,d:d,p:+fp.value,st:"Demande",log:null,paye:0});log("Demande reçue de "+nm(+fc.value));save();draw()}
function nm(id){var c=cl(id);return c.prenom+" "+c.nom}
function act(id,q){var r=S.R.find(function(x){return x.id==id}),l=r.log&&lg(r.log);
if(q=="conf"){var n=+document.getElementById("s"+id).value;if(!n)return alert("Choisir un logement.");r.log=n;r.total=nuits(r)*lg(n).prix;r.paye=Math.round(r.total*.3);r.st="Confirmée";log("Réservation n°"+id+" confirmée, logement "+n+", acompte "+r.paye+" € encaissé")}
if(q=="ann"){r.st="Annulée";log("Réservation n°"+id+" annulée")}
if(q=="in"){if(l.etat!="Propre")return alert("Le logement n'est pas propre.");r.st="Arrivée";l.etat="Occupé";log(nm(r.c)+" arrivé(e), logement "+r.log)}
if(q=="out"){var s=r.total-r.paye;r.paye=r.total;r.st="Terminée";l.etat="À nettoyer";log(nm(r.c)+" parti(e), solde "+s+" € encaissé, facture "+r.total+" €, logement "+r.log+" à nettoyer")}
save();draw()}
function propre(n){lg(n).etat="Propre";log("Logement "+n+" nettoyé");save();draw()}
function draw(){fc.innerHTML=S.C.map(function(c){return"<option value="+c.id+">"+c.prenom+" "+c.nom+"</option>"}).join("");
tr.innerHTML="<tr><th>N°</th><th>Client</th><th>Dates</th><th>Pers.</th><th>Logement</th><th>Total</th><th>Payé</th><th>Statut</th><th>Action</th></tr>"+S.R.map(function(r){var a="";
if(r.st=="Demande")a="<select id=s"+r.id+"><option value=''>logement</option>"+S.L.filter(function(l){return l.cap>=r.p&&libre(l.n,r.a,r.d,r.id)}).map(function(l){return"<option value="+l.n+">"+l.n+" "+l.type+" "+l.prix+" €/nuit</option>"}).join("")+"</select><button onclick=act("+r.id+",'conf')>Confirmer</button><button onclick=act("+r.id+",'ann')>Refuser</button>";
if(r.st=="Confirmée")a="<button onclick=act("+r.id+",'in')>Check-in</button><button onclick=act("+r.id+",'ann')>Annuler</button>";
if(r.st=="Arrivée")a="<button onclick=act("+r.id+",'out')>Check-out et solde</button>";
return"<tr><td>"+r.id+"</td><td>"+nm(r.c)+"</td><td>"+r.a+" → "+r.d+" ("+nuits(r)+" nuits)</td><td>"+r.p+"</td><td>"+(r.log||"")+"</td><td>"+(r.total||"")+"</td><td>"+r.paye+"</td><td>"+r.st+"</td><td>"+a+"</td></tr>"}).join("");
tl.innerHTML="<tr><th>N°</th><th>Type</th><th>Capacité</th><th>Prix/nuit</th><th>État</th></tr>"+S.L.map(function(l){return"<tr><td>"+l.n+"</td><td>"+l.type+"</td><td>"+l.cap+"</td><td>"+l.prix+" €</td><td>"+l.etat+(l.etat=="À nettoyer"?" <button onclick=propre("+l.n+")>Marquer propre</button>":"")+"</td></tr>"}).join("");
tc.innerHTML="<tr><th>Client</th><th>E-mail</th><th>Téléphone</th><th>Préférence</th><th>Séjours</th></tr>"+S.C.map(function(c){return"<tr><td>"+c.prenom+" "+c.nom+"</td><td>"+c.mail+"</td><td>"+c.tel+"</td><td>"+c.pref+"</td><td>"+S.R.filter(function(r){return r.c==c.id}).length+"</td></tr>"}).join("");
tj.innerHTML=S.J.map(function(j){return"<li>"+j+"</li>"}).join("")}
try{S=JSON.parse(localStorage.pmsTest2)}catch(e){}if(!S)init();draw();
</script></body></html>
